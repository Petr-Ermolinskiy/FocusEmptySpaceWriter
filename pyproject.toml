[project]
name = "focus-emty-space-writer"
version = "0.1.0"
description = "A minimalistic, distraction-free markdown note-taking application"
authors = [
    { name = "petr", email = "ermolinskiy.pb15@physics.msu.ru" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.12.0",
]

[project.scripts]
focus-emty-space-writer = "src.main:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pyinstaller>=6.3.0,<7.0.0",
    "pillow>=10.2.0,<11.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
